<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BPS Report Emblem: Bangladesh & Saudi Arabia Harmonized Heritage -->
  <defs>
    <clipPath id="bd-half">
      <path d="M32 3 L7 16 V42 L32 61 Z" />
    </clipPath>
    <clipPath id="saudi-half">
      <path d="M32 3 L57 16 V42 L32 61 Z" />
    </clipPath>
  </defs>

  <!-- Left: Bangladesh Deep Bottle Green Field -->
  <path d="M32 3 L7 16 V42 L32 61 Z" fill="#006A4E" />

  <!-- Right: Saudi Arabia Deep Forest Green Field -->
  <path d="M32 3 L57 16 V42 L32 61 Z" fill="#0B6B3A" />

  <!-- Inner Architectural Geometric Shield Border -->
  <path
    d="M32 7.5 L52.5 18 V39.5 L32 56 L11.5 39.5 V18 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Central Clean Vertical White Divider -->
  <line x1="32" y1="4.5" x2="32" y2="59" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bangladesh National Symbol: Red Circular Disc on Green Field -->
  <circle cx="20.5" cy="31.5" r="8" fill="#E63946" stroke="#FFFFFF" stroke-width="1" />

  <!-- Saudi Arabia National Symbol: Authentic White Curved Arab Sword (pointing left toward hoist) -->
  <g fill="#FFFFFF">
    <!-- Crossguard -->
    <path d="M47.2 26.5 C47.8 25.8 48.8 25.8 49.4 26.6 V36.4 C48.8 37.2 47.8 37.2 47.2 36.5 Z" />
    <!-- Grip / Handle -->
    <rect x="49.2" y="30.5" width="3.6" height="2" rx="0.4" />
    <!-- Pommel -->
    <path d="M52.8 30.4 C54.2 30.4 55 31.6 54.5 33 C53.9 34.2 52.6 34.2 52.4 32.6 Z" />
    <!-- Scimitar Curved Blade -->
    <path d="M47.2 30.6 L41.5 30.6 C38 30.6 36 29.8 34.6 28.5 C35.8 31.2 38.6 32.8 42.2 32.8 L47.2 32.4 Z" />
  </g>
</svg>
